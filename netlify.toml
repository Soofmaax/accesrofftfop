[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "18"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[redirects]]
from = "http://www.art-et-maison.com/*"
to = "https://art-et-maison.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.art-et-maison.com/*"
to = "https://art-et-maison.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://art-et-maison.com/*"
to = "https://art-et-maison.com/:splat"
status = 301
force = true

# Redirections depuis les anciennes URLs .html (site historique)
